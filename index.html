<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>奥林匹斯众神志 · 版本入口</title>
  <meta name="description" content="奥林匹斯众神志入口：两份独立编排的古希腊神话人物图鉴。" />
  <style>
    :root {
      --night: #0e1018;
      --deep: #17141d;
      --wine: #2a1520;
      --marble: #f4ecdf;
      --marble-dim: rgba(244, 236, 223, .72);
      --marble-faint: rgba(244, 236, 223, .48);
      --gold: #cda761;
      --gold-soft: rgba(205, 167, 97, .35);
      --blue: #233d4d;
      --fig: #4a2330;
      --line: rgba(205, 167, 97, .28);
      --shadow: 0 32px 90px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 20%, rgba(205, 167, 97, .16), transparent 28rem),
        radial-gradient(circle at 88% 18%, rgba(71, 42, 25, .22), transparent 34rem),
        linear-gradient(135deg, #0d111b 0%, #211823 48%, #11131b 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--marble);
      font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 49.8%, rgba(205, 167, 97, .1) 50%, transparent 50.2%),
        linear-gradient(180deg, transparent 0 49.8%, rgba(205, 167, 97, .08) 50%, transparent 50.2%);
      background-size: 86px 86px;
      mask-image: radial-gradient(circle at 50% 42%, black 0 42%, transparent 76%);
      opacity: .65;
    }

    a { color: inherit; }

    .stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: clamp(22px, 4vw, 56px);
    }

    .panel {
      position: relative;
      width: min(1220px, 100%);
      margin: auto;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(244, 236, 223, .09), rgba(244, 236, 223, .025)),
        rgba(14, 16, 24, .76);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, .55fr);
      min-height: 430px;
      border-bottom: 1px solid var(--line);
    }

    .hero {
      padding: clamp(34px, 6vw, 78px);
    }

    .kicker {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      color: #e6c987;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 48px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(54px, 9vw, 132px);
      line-height: .94;
      letter-spacing: -.075em;
      text-wrap: balance;
    }

    .intro {
      max-width: 760px;
      margin: 30px 0 0;
      color: var(--marble-dim);
      font-size: clamp(18px, 2.1vw, 25px);
      line-height: 1.8;
      text-wrap: balance;
    }

    .seal-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100%;
      border-left: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 45%, rgba(205, 167, 97, .2), transparent 15rem),
        linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    }

    .seal {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(190px, 25vw, 310px);
      aspect-ratio: 1;
      border: 1px solid rgba(205, 167, 97, .55);
      border-radius: 999px;
      color: rgba(244, 236, 223, .88);
      font-size: clamp(72px, 10vw, 132px);
      line-height: 1;
    }

    .seal::before,
    .seal::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(205, 167, 97, .32);
      border-radius: inherit;
    }

    .seal::after {
      inset: 42px;
      border-style: dashed;
      opacity: .55;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      background: var(--line);
      gap: 1px;
    }

    .choice {
      position: relative;
      min-height: 390px;
      padding: clamp(30px, 5vw, 58px);
      text-decoration: none;
      background:
        linear-gradient(145deg, rgba(244, 236, 223, .075), rgba(244, 236, 223, .018)),
        var(--deep);
      overflow: hidden;
      transition: transform .28s ease, background .28s ease, filter .28s ease;
    }

    .choice:nth-child(1) { --accent: var(--blue); }
    .choice:nth-child(2) { --accent: var(--fig); }

    .choice::before {
      content: "";
      position: absolute;
      inset: auto -10% -45% 18%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 82%, transparent), transparent 68%);
      opacity: .42;
      filter: blur(4px);
    }

    .choice:hover {
      transform: translateY(-3px);
      background:
        linear-gradient(145deg, rgba(244, 236, 223, .11), rgba(244, 236, 223, .024)),
        #191722;
    }

    .choice:focus-visible {
      outline: 3px solid #efd594;
      outline-offset: -10px;
    }

    .volume {
      position: relative;
      z-index: 1;
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 34px;
      border: 1px solid rgba(244, 236, 223, .25);
      border-radius: 999px;
      background: rgba(0, 0, 0, .18);
      color: #f7e7ae;
      font-family: ui-serif, Georgia, serif;
      font-size: 24px;
      letter-spacing: .04em;
    }

    .label {
      position: relative;
      z-index: 1;
      margin: 0 0 14px;
      color: rgba(239, 213, 148, .9);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .choice h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(38px, 6vw, 76px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .choice p {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 24px 0 0;
      color: var(--marble-dim);
      font-size: 17px;
      line-height: 1.82;
    }

    .enter {
      position: absolute;
      z-index: 1;
      left: clamp(30px, 5vw, 58px);
      right: clamp(30px, 5vw, 58px);
      bottom: clamp(28px, 4vw, 46px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(244, 236, 223, .18);
      color: #ffe9aa;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 233, 170, .4);
      border-radius: 999px;
      background: rgba(0, 0, 0, .2);
      transition: transform .28s ease;
    }

    .choice:hover .arrow { transform: translateX(6px); }

    .footnote {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      padding: 22px clamp(30px, 5vw, 58px);
      color: var(--marble-faint);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.7;
      background: rgba(0, 0, 0, .18);
    }

    .footnote span:last-child {
      color: rgba(239, 213, 148, .72);
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .top,
      .choice-grid {
        grid-template-columns: 1fr;
      }

      .seal-wrap {
        min-height: 250px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .choice { min-height: 360px; }
      .footnote { flex-direction: column; }
      .footnote span:last-child { white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="panel" aria-labelledby="title">
      <div class="top">
        <header class="hero">
          <div class="kicker">Mythological Atlas</div>
          <h1 id="title">奥林匹斯众神志</h1>
          <p class="intro">
            同一座神话殿堂，两份独立编排。请选择其中一卷进入阅读；它们不是高低比较，也不代表品牌立场，只是两条不同的策展路线。
          </p>
        </header>
        <aside class="seal-wrap" aria-hidden="true">
          <div class="seal">Ω</div>
        </aside>
      </div>

      <nav class="choice-grid" aria-label="选择图鉴版本">
        <a class="choice" href="./edition-a.html" aria-label="进入第一卷">
          <div class="volume">Ⅰ</div>
          <p class="label">Edition one</p>
          <h2>第一卷</h2>
          <p>以恢弘、沉浸的视觉秩序展开众神、英雄与谱系，适合从整体气氛开始阅读。</p>
          <div class="enter">
            <span>进入第一卷</span>
            <span class="arrow">→</span>
          </div>
        </a>

        <a class="choice" href="./edition-b.html" aria-label="进入第二卷">
          <div class="volume">Ⅱ</div>
          <p class="label">Edition two</p>
          <h2>第二卷</h2>
          <p>保留另一份独立图鉴的结构与表达，适合作为平行版本对照浏览。</p>
          <div class="enter">
            <span>进入第二卷</span>
            <span class="arrow">→</span>
          </div>
        </a>
      </nav>

      <footer class="footnote">
        <span>首页只负责引路；两卷内容各自独立，不在入口页标注生成来源。</span>
        <span>Chronicles of Olympus</span>
      </footer>
    </section>
  </main>
</body>
</html>
