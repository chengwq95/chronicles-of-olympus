<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>奥林匹斯众神志 · 入口</title>
  <meta name="description" content="奥林匹斯众神志：选择星图版或神殿版，进入古希腊神话人物图鉴。" />
  <style>
    :root {
      --void: #050507;
      --stone: #0b0b0d;
      --panel: #111116;
      --ivory: #f2e8d6;
      --ivory-dim: rgba(242, 232, 214, .76);
      --ivory-soft: rgba(242, 232, 214, .56);
      --gold: #d9b267;
      --gold-bright: #f2d891;
      --gold-line: rgba(217, 178, 103, .52);
      --blue: #0b2438;
      --wine: #351323;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
      --page-pad: clamp(18px, 4vw, 62px);
      --content: min(1510px, calc(100vw - var(--page-pad) * 2));
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.72)),
        url("./assets/olympus-atlas-bg.jpg") center / cover fixed no-repeat,
        #050507;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ivory);
      font-family: var(--serif);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 28% 22%, rgba(217,178,103,.14), transparent 28rem),
        radial-gradient(circle at 78% 78%, rgba(78,18,45,.24), transparent 34rem),
        linear-gradient(90deg, rgba(0,0,0,.72), transparent 20% 78%, rgba(0,0,0,.72)),
        linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.04) 42%, rgba(0,0,0,.68));
      opacity: .96;
    }

    body::after {
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
        radial-gradient(ellipse at 50% 100%, rgba(217,178,103,.15), transparent 30rem);
      mix-blend-mode: screen;
      opacity: .22;
    }

    a { color: inherit; }

    .stage {
      position: relative;
      min-height: 100vh;
      padding: clamp(16px, 2vw, 34px);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.58));
      opacity: 1;
    }

    .shell {
      width: var(--content);
      min-height: calc(100vh - clamp(32px, 4vw, 68px));
      margin: auto;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: clamp(18px, 2.3vw, 30px);
      padding: clamp(24px, 3.4vw, 52px) 0 0;
    }

    .hero {
      position: relative;
      min-height: clamp(270px, 29vw, 360px);
      padding: 0 clamp(18px, 3.2vw, 54px);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 28% 42%, rgba(0,0,0,.36), transparent 34rem),
        linear-gradient(90deg, rgba(0,0,0,.22), transparent 62%);
    }

    .hero::after {
      display: none;
    }

    .kicker {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin: 38px 0 22px;
      color: var(--gold-bright);
      font-family: var(--sans);
      font-size: clamp(11px, .9vw, 14px);
      font-weight: 850;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 64px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: 0;
      font-size: clamp(62px, 8vw, 118px);
      line-height: .95;
      letter-spacing: -.075em;
      text-shadow: 0 20px 70px rgba(0,0,0,.62);
    }

    .intro {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 26px 0 0;
      color: var(--ivory-dim);
      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1.85;
      letter-spacing: .02em;
    }

    .choices-wrap {
      position: relative;
      padding: 0 clamp(18px, 3.2vw, 54px);
    }

    .choices-wrap::before {
      content: "";
      position: absolute;
      left: clamp(18px, 3.2vw, 54px);
      right: clamp(18px, 3.2vw, 54px);
      top: -18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-line) 12% 88%, transparent);
    }

    .choices-wrap::after {
      content: "◇";
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 22px;
      text-shadow: 0 0 20px rgba(217,178,103,.6);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2vw, 28px);
    }

    .choice {
      --accent: #0f314b;
      --accent-glow: rgba(28, 90, 127, .34);
      position: relative;
      min-height: clamp(320px, 25vw, 385px);
      display: grid;
      align-items: center;
      border: 1px solid var(--gold-line);
      border-radius: 7px;
      text-decoration: none;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(242,232,214,.08), transparent 52%),
        radial-gradient(circle at 18% 88%, var(--accent-glow), transparent 21rem),
        rgba(12, 12, 17, .72);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.5),
        0 28px 80px rgba(0,0,0,.42);
      backdrop-filter: blur(2px) saturate(1.1);
      transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
    }

    .choice::before,
    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .choice::before {
      border: 1px solid rgba(242,216,145,.15);
      inset: 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .star::after {
      background:
        radial-gradient(circle at 8% 73%, rgba(242,216,145,.95) 0 2px, transparent 4px),
        radial-gradient(circle at 24% 26%, rgba(242,216,145,.65) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 57%, rgba(242,216,145,.52) 0 1px, transparent 2px),
        radial-gradient(circle at 60% 18%, rgba(242,216,145,.5) 0 1px, transparent 2px),
        repeating-radial-gradient(circle at 8% 73%, transparent 0 52px, rgba(217,178,103,.27) 53px 54px),
        linear-gradient(28deg, transparent 0 35%, rgba(217,178,103,.16) 35.2%, transparent 35.5%),
        linear-gradient(148deg, transparent 0 50%, rgba(217,178,103,.12) 50.2%, transparent 50.5%),
        radial-gradient(circle at 16% 52%, rgba(14,56,88,.46), transparent 28rem);
      opacity: .9;
    }

    .temple {
      --accent: #4c172d;
      --accent-glow: rgba(98, 25, 55, .38);
    }

    .temple::after {
      background:
        linear-gradient(90deg, transparent 0 55%, rgba(217,178,103,.12) 55.15% 55.8%, transparent 56% 64%, rgba(217,178,103,.24) 64.15% 65%, transparent 65.2% 72%, rgba(217,178,103,.16) 72.15% 72.8%, transparent 73% 82%, rgba(217,178,103,.18) 82.15% 82.8%, transparent 83%),
        linear-gradient(180deg, transparent 0 18%, rgba(217,178,103,.2) 18.2% 19.1%, transparent 19.4% 79%, rgba(217,178,103,.18) 79.2% 80%, transparent 80.4%),
        radial-gradient(ellipse at 82% 65%, rgba(217,178,103,.16), transparent 18rem),
        radial-gradient(circle at 20% 92%, rgba(88,18,50,.45), transparent 23rem);
      opacity: .9;
    }

    .choice:hover {
      transform: translateY(-4px);
      border-color: rgba(242,216,145,.8);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.4),
        0 34px 92px rgba(0,0,0,.52),
        0 0 54px rgba(217,178,103,.1);
    }

    .choice:focus-visible {
      outline: 3px solid var(--gold-bright);
      outline-offset: 5px;
    }

    .card-copy {
      position: relative;
      z-index: 3;
      width: min(430px, 62%);
      padding: clamp(24px, 3vw, 42px);
    }

    .star .card-copy {
      margin-left: auto;
      text-align: center;
    }

    .temple .card-copy {
      margin-right: auto;
      text-align: left;
    }

    .route {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--gold-bright);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .route::before {
      content: "";
      width: 50px;
      height: 1px;
      background: currentColor;
      opacity: .82;
    }

    .star .route {
      justify-content: center;
    }

    h2 {
      margin: 20px 0 0;
      font-size: clamp(40px, 4.5vw, 64px);
      line-height: .96;
      letter-spacing: -.06em;
      text-shadow: 0 18px 48px rgba(0,0,0,.5);
    }

    .choice p {
      margin: 12px 0 0;
      color: var(--ivory-dim);
      font-size: clamp(15px, 1.15vw, 18px);
      line-height: 1.62;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-width: 230px;
      margin-top: 22px;
      padding: 12px 22px;
      border: 1px solid rgba(242,216,145,.55);
      background:
        linear-gradient(180deg, rgba(242,216,145,.08), rgba(0,0,0,.2)),
        color-mix(in srgb, var(--accent) 42%, rgba(0,0,0,.24));
      color: #ffe5a8;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: .16em;
      box-shadow: inset 0 0 0 4px rgba(0,0,0,.18);
    }

    .arrow {
      transition: transform .28s ease;
    }

    .choice:hover .arrow {
      transform: translateX(6px);
    }

    .footer {
      padding: 0 clamp(18px, 3.2vw, 54px) 18px;
      color: rgba(242,232,214,.5);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .shell {
        gap: 22px;
      }

      .hero {
        min-height: auto;
      }

      h1 {
        font-size: clamp(54px, 16vw, 100px);
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .card-copy {
        width: min(440px, 74%);
      }
    }

    @media (max-width: 640px) {
      :root {
        --page-pad: 10px;
      }

      .shell {
        padding-top: 14px;
      }

      .hero,
      .choices-wrap,
      .footer {
        padding-left: 8px;
        padding-right: 8px;
      }

      .choice {
        min-height: 360px;
      }

      .card-copy {
        width: 100%;
        text-align: left;
      }

      .star .card-copy {
        margin-left: 0;
        text-align: left;
      }

      .star .route {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="shell" aria-labelledby="title">
      <header class="hero">
        <div class="kicker">Mythological Atlas</div>
        <h1 id="title">奥林匹斯众神志</h1>
        <p class="intro">
          众神的谱系、英雄的远征、怪物的阴影与命运的回声，在这里汇成一座可进入的神话图鉴。
        </p>
      </header>

      <div class="choices-wrap">
        <nav class="choices" aria-label="选择图鉴入口">
          <a class="choice star" href="./edition-a.html" aria-label="进入星图版">
            <div class="card-copy">
              <div class="route">关系与谱系</div>
              <h2>星图版</h2>
              <p>从人物关系、血缘线索与命运牵引进入，像展开一张夜空地图，沿星轨寻找众神与英雄的位置。</p>
              <span class="enter">进入星图版 <span class="arrow">›</span></span>
            </div>
          </a>

          <a class="choice temple" href="./edition-b.html" aria-label="进入神殿版">
            <div class="card-copy">
              <div class="route">人物与象征</div>
              <h2>神殿版</h2>
              <p>从神祇、泰坦、英雄与怪物的陈列进入，更适合快速浏览人物身份、象征物与经典故事片段。</p>
              <span class="enter">进入神殿版 <span class="arrow">›</span></span>
            </div>
          </a>
        </nav>
      </div>

      <footer class="footer">Chronicles of Olympus</footer>
    </section>
  </main>
</body>
</html>
