<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>奥林匹斯众神志 · 入口</title>
  <meta name="description" content="奥林匹斯众神志：选择星图版或神殿版，进入古希腊神话人物图鉴。" />
  <style>
    :root {
      --void: #06060c;
      --obsidian: #0c0d13;
      --basalt: #171720;
      --slate: #22222c;
      --ivory: #f2e8d7;
      --ivory-soft: rgba(242, 232, 215, .72);
      --ivory-faint: rgba(242, 232, 215, .48);
      --gold: #d8b260;
      --gold-strong: #f1d28a;
      --gold-line: rgba(216, 178, 96, .34);
      --blue: #102f47;
      --blue-lit: rgba(36, 107, 146, .34);
      --wine: #431529;
      --wine-lit: rgba(104, 28, 61, .34);
      --shadow: 0 48px 150px rgba(0, 0, 0, .58);
      --pad: clamp(28px, 5vw, 72px);
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 10%, rgba(216, 178, 96, .18), transparent 28rem),
        radial-gradient(circle at 82% 16%, rgba(64, 28, 74, .3), transparent 34rem),
        radial-gradient(circle at 50% 100%, rgba(15, 55, 76, .2), transparent 40rem),
        linear-gradient(135deg, #05050b 0%, #10111a 48%, #23121f 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ivory);
      font-family: var(--serif);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(216, 178, 96, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(216, 178, 96, .035) 1px, transparent 1px);
      background-size: 92px 92px;
      mask-image: radial-gradient(circle at 50% 42%, black 0 42%, transparent 74%);
      opacity: .75;
    }

    a { color: inherit; }

    .stage {
      min-height: 100vh;
      padding: clamp(16px, 2.6vw, 40px);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(1440px, 100%);
      min-height: calc(100vh - clamp(32px, 5.2vw, 80px));
      margin: auto;
      border: 1px solid var(--gold-line);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(242, 232, 215, .07), rgba(242, 232, 215, .018)),
        rgba(8, 8, 14, .88);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 22% 20%, rgba(216, 178, 96, .14), transparent 34rem),
        radial-gradient(ellipse at 80% 80%, rgba(79, 18, 49, .28), transparent 38rem),
        linear-gradient(120deg, rgba(255,255,255,.035), transparent 42%);
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .52;
      background-image:
        radial-gradient(circle at 12% 28%, rgba(241, 210, 138, .7) 0 1px, transparent 1.8px),
        radial-gradient(circle at 27% 16%, rgba(241, 210, 138, .52) 0 1px, transparent 1.7px),
        radial-gradient(circle at 44% 22%, rgba(241, 210, 138, .46) 0 1px, transparent 1.7px),
        radial-gradient(circle at 62% 13%, rgba(241, 210, 138, .55) 0 1px, transparent 1.7px),
        radial-gradient(circle at 84% 30%, rgba(241, 210, 138, .48) 0 1px, transparent 1.7px),
        linear-gradient(26deg, transparent 0 20%, rgba(216,178,96,.18) 20.2%, transparent 20.5% 100%),
        linear-gradient(154deg, transparent 0 31%, rgba(216,178,96,.13) 31.15%, transparent 31.45% 100%),
        linear-gradient(8deg, transparent 0 61%, rgba(216,178,96,.1) 61.1%, transparent 61.4% 100%);
      mask-image: linear-gradient(180deg, black 0 70%, transparent 100%);
    }

    .hero {
      position: relative;
      min-height: clamp(330px, 40vw, 520px);
      padding: clamp(48px, 7vw, 108px) var(--pad) clamp(42px, 5vw, 76px);
      border-bottom: 1px solid var(--gold-line);
    }

    .hero::before {
      content: "";
      position: absolute;
      right: max(30px, 7vw);
      top: 20px;
      width: min(38vw, 520px);
      height: min(30vw, 420px);
      pointer-events: none;
      opacity: .42;
      background:
        linear-gradient(90deg, transparent 0 23%, rgba(216,178,96,.16) 23.15% 23.5%, transparent 23.65% 100%),
        linear-gradient(90deg, transparent 0 39%, rgba(216,178,96,.14) 39.15% 39.45%, transparent 39.6% 100%),
        linear-gradient(90deg, transparent 0 55%, rgba(216,178,96,.12) 55.15% 55.45%, transparent 55.6% 100%),
        radial-gradient(ellipse at 58% 62%, rgba(216,178,96,.15), transparent 60%);
      clip-path: polygon(16% 100%, 31% 18%, 78% 18%, 92% 100%);
      filter: drop-shadow(0 28px 55px rgba(0,0,0,.42));
    }

    .hero::after {
      content: "";
      position: absolute;
      right: 7%;
      bottom: 34px;
      width: min(44vw, 600px);
      aspect-ratio: 1;
      pointer-events: none;
      border: 1px solid rgba(216,178,96,.18);
      border-radius: 50%;
      transform: rotate(-18deg);
      box-shadow:
        inset 0 0 0 44px rgba(216,178,96,.025),
        inset 0 0 0 118px rgba(216,178,96,.018);
      mask-image: linear-gradient(90deg, transparent 0, black 42%, black 100%);
      opacity: .8;
    }

    .kicker {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      color: var(--gold-strong);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .26em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 58px;
      height: 1px;
      background: currentColor;
      opacity: .86;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0;
      font-size: clamp(62px, 9.3vw, 142px);
      line-height: .9;
      letter-spacing: -.08em;
      text-wrap: balance;
      text-shadow: 0 20px 60px rgba(0, 0, 0, .54);
    }

    .intro {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 28px 0 0;
      color: var(--ivory-soft);
      font-size: clamp(18px, 2vw, 25px);
      line-height: 1.82;
      text-wrap: balance;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--gold-line);
    }

    .choice {
      --accent: var(--blue);
      --glow: var(--blue-lit);
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: clamp(360px, 34vw, 460px);
      padding: clamp(34px, 5vw, 68px);
      text-decoration: none;
      background:
        linear-gradient(145deg, rgba(242, 232, 215, .08), rgba(242, 232, 215, .018)),
        var(--basalt);
      overflow: hidden;
      transition: transform .28s ease, background .28s ease;
    }

    .choice.temple {
      --accent: var(--wine);
      --glow: var(--wine-lit);
    }

    .choice::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 82%, var(--glow), transparent 34rem),
        radial-gradient(circle at 84% 18%, rgba(216, 178, 96, .12), transparent 22rem);
      opacity: .95;
    }

    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .58;
    }

    .choice.star::after {
      background:
        radial-gradient(circle at 16% 70%, rgba(241,210,138,.88) 0 1px, transparent 2px),
        radial-gradient(circle at 24% 32%, rgba(241,210,138,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 43% 52%, rgba(241,210,138,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 28%, rgba(241,210,138,.5) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 72%, rgba(241,210,138,.5) 0 1px, transparent 2px),
        repeating-radial-gradient(circle at 10% 88%, transparent 0 58px, rgba(216,178,96,.13) 59px 60px);
    }

    .choice.temple::after {
      background:
        linear-gradient(90deg, transparent 0 56%, rgba(216,178,96,.18) 56.1% 56.5%, transparent 56.6% 100%),
        linear-gradient(90deg, transparent 0 66%, rgba(216,178,96,.13) 66.1% 66.5%, transparent 66.6% 100%),
        linear-gradient(90deg, transparent 0 76%, rgba(216,178,96,.16) 76.1% 76.5%, transparent 76.6% 100%),
        linear-gradient(180deg, transparent 0 30%, rgba(216,178,96,.12) 30.1% 31%, transparent 31.1% 100%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 36% 100%, 36% 24%, 100% 24%, 100% 0);
    }

    .choice:hover {
      transform: translateY(-3px);
      background:
        linear-gradient(145deg, rgba(242, 232, 215, .115), rgba(242, 232, 215, .024)),
        #1e1c27;
    }

    .choice:focus-visible {
      outline: 3px solid var(--gold-strong);
      outline-offset: -10px;
    }

    .route {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      color: var(--gold-strong);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .16em;
    }

    .route::before {
      content: "";
      width: 52px;
      height: 1px;
      background: currentColor;
      opacity: .76;
    }

    .choice h2 {
      position: relative;
      z-index: 1;
      margin: 30px 0 0;
      font-size: clamp(48px, 6.4vw, 88px);
      line-height: .95;
      letter-spacing: -.06em;
      text-shadow: 0 16px 50px rgba(0,0,0,.45);
    }

    .choice p {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--ivory-soft);
      font-size: clamp(16px, 1.5vw, 20px);
      line-height: 1.78;
    }

    .enter {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: clamp(34px, 5vw, 62px);
      padding-top: 22px;
      border-top: 1px solid rgba(242, 232, 215, .2);
      color: #ffe4a4;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .arrow {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 228, 164, .46);
      border-radius: 50%;
      background: rgba(0, 0, 0, .18);
      transition: transform .28s ease, background .28s ease;
    }

    .choice:hover .arrow {
      transform: translateX(7px);
      background: color-mix(in srgb, var(--accent) 45%, rgba(0, 0, 0, .18));
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      padding: 20px var(--pad);
      color: var(--ivory-faint);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, .22);
    }

    @media (max-width: 900px) {
      .hero {
        min-height: auto;
      }

      .hero::before,
      .hero::after {
        opacity: .24;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        min-height: 350px;
      }
    }

    @media (max-width: 640px) {
      .stage {
        padding: 12px;
      }

      .frame {
        border-radius: 22px;
      }

      .hero,
      .choice {
        padding-left: 26px;
        padding-right: 26px;
      }

      .kicker,
      .route,
      .footer {
        letter-spacing: .12em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="frame" aria-labelledby="title">
      <header class="hero">
        <div class="kicker">Mythological Atlas</div>
        <h1 id="title">奥林匹斯众神志</h1>
        <p class="intro">
          众神、英雄、怪物与命运，被整理成两种观看路径。你可以从星幕般的关系网进入，也可以从神殿般的陈列开始。
        </p>
      </header>

      <nav class="choices" aria-label="选择图鉴入口">
        <a class="choice star" href="./edition-a.html" aria-label="进入星图版">
          <div class="route">关系与谱系</div>
          <h2>星图版</h2>
          <p>从人物关系、血缘线索与命运牵引进入，像展开一张夜空地图，沿星轨寻找众神与英雄的位置。</p>
          <div class="enter">
            <span>进入星图版</span>
            <span class="arrow">→</span>
          </div>
        </a>

        <a class="choice temple" href="./edition-b.html" aria-label="进入神殿版">
          <div class="route">人物与象征</div>
          <h2>神殿版</h2>
          <p>从神祇、泰坦、英雄与怪物的陈列进入，更适合快速浏览人物身份、象征物与经典故事片段。</p>
          <div class="enter">
            <span>进入神殿版</span>
            <span class="arrow">→</span>
          </div>
        </a>
      </nav>

      <footer class="footer">Chronicles of Olympus</footer>
    </section>
  </main>
</body>
</html>
